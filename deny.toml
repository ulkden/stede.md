# cargo-deny config: keeps every dependency compatible with GPL-3.0-or-later.
# Run `cargo deny check`. A new license here needs a reason in the PR.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is policy, set ahead of the crates that need it.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # The older Unicode license (finl_unicode, via comrak). Permissive, like
    # Unicode-3.0, and listed by the FSF as GPL-compatible.
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "Artistic-2.0",
    "MPL-2.0",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
