# The 14-day rule (CONTRIBUTING.md): every crate, toolchain, action or dev-tool
# version a PR introduces must be at least 14 days old, unless it is a patch bump.
# Dependabot's cooldown covers most of this, but not the toolchain (no publish
# date in its registry) and not hand edits, so this check enforces it everywhere.
#
# For a security fix that isn't a patch bump, add the `dependency-age-exempt`
# label and say why in the PR. The check then reports but doesn't fail.
#
# A PR that is too new fails until its eligible date. Re-run this job after that
# date, or let Dependabot's next rebase re-run it.
name: Dependency age

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  age:
    name: New dependency versions are 14+ days old
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check dependency age
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'dependency-age-exempt') }}
        run: |
          args=()
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          if [ "$EXEMPT" = "true" ]; then args+=(--exempt); fi
          python3 scripts/dependency-age.py "${args[@]}"
